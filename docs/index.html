  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* sidebar */
.side{background:var(--roast);color:var(--roast-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start}
.brand{display:flex;flex-direction:column;gap:6px;padding:4px 8px 0;color:#FFFFFF}
.brand .logo-txt{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1;letter-spacing:-.01em;word-break:break-word}
.brand small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--roast-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--roast-muted);font-weight:500}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav button:hover{color:var(--roast-ink);background:var(--roast-2)}
.nav button[aria-current="page"]{color:var(--roast-ink);background:var(--roast-2)}
.nav button[aria-current="page"] svg{stroke:#F0A58F}
.nav button[aria-current="page"]{box-shadow:inset 3px 0 0 var(--logo-red)}
.nav button:focus-visible{outline:2px solid var(--in);outline-offset:1px}
.nav .badge{margin-left:auto;background:var(--logo-red);color:#fff;border-radius:999px;font-size:11px;font-weight:600;padding:0 7px;line-height:18px}
.nav .sep{height:1px;background:var(--roast-2);margin:8px 4px}
.side .conn{margin-top:auto;font-size:12px;color:var(--roast-muted);padding:0 8px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--roast-muted);flex:none}
.dot.on{background:#3FC29B}.dot.off{background:#E0A64A}
/* main */
main{padding-block:28px 64px;padding-inline:32px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted)}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.icon-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card-c:focus-visible,.cal-day:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.pri{background:var(--roast);border-color:var(--roast);color:var(--roast-ink)}
:root[data-theme="dark"] .btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:4px 6px;border-radius:6px;color:var(--muted)}
.icon-btn:hover{background:var(--line-2);color:var(--ink)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-weight:500}
.banner.info{background:var(--info-bg);color:var(--info)}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em}
.panel h2 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.6fr 1fr}
.g2e{grid-template-columns:1fr 1fr}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-mono);font-size:22px;font-weight:500;letter-spacing:-.02em}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:var(--roast);border-color:var(--roast-2);color:var(--roast-ink)}
.kpi.hero .lbl,.kpi.hero .sub{color:var(--roast-muted)}
.neg{color:var(--neg)}.pos{color:var(--pos)}
/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
input[type=text],input[type=date],input[type=month],input[type=time],input[type=number],input[type=email],input[type=tel],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.toolbar select,.toolbar input{width:auto}
textarea{resize:vertical;min-height:70px}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
td.r,th.r{text-align:right}
td .desc{font-weight:500}
td .meta{font-size:12px;color:var(--muted)}
tfoot td{font-weight:600;background:var(--surface-2)}
.dre td{padding:7px 12px}
.dre tr.grp td{font-weight:600}
.dre tr.sub td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.dre tr.tot td{font-weight:700;background:var(--roast);color:var(--roast-ink)}
.dre tr.cat td:first-child{padding-left:28px;color:var(--ink-2)}
.dre td:first-child{white-space:nowrap}
.dre td.pct{color:var(--muted);font-size:12px}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pago{background:var(--pos-bg);color:var(--pos)}
.st-vencido{background:var(--neg-bg);color:var(--neg)}
.st-vence{background:var(--warn-bg);color:var(--warn)}
.st-aberto{background:var(--line-2);color:var(--ink-2)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;background:var(--line-2);color:var(--ink-2);font-weight:500}
.tag.ex{background:var(--info-bg);color:var(--info)}
.tipo-r{color:var(--in);font-weight:600}.tipo-d{color:var(--out);font-weight:600}
.arrow{font-family:var(--f-mono);font-weight:500}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:0}
.li .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:46px;text-align:center;line-height:1.15}
.li .d b{display:block;font-size:17px;color:var(--ink);font-weight:500}
.empty{color:var(--muted);padding:18px 0;text-align:center}
/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:9px 11px;border-radius:8px;font-size:12px;box-shadow:var(--shadow);z-index:5;min-width:190px}
.tip b{display:block;margin-bottom:4px;font-family:var(--f-body)}
.tip div{display:flex;justify-content:space-between;gap:14px;font-family:var(--f-mono)}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col h3{margin:2px 4px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between}
.card-c{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card-c:hover{border-color:var(--muted)}
.card-c .n{font-weight:600}
.card-c .m{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.cal .wd{padding:8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:600}
.cal-day{min-height:96px;padding:6px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);cursor:pointer;display:flex;flex-direction:column;gap:3px;background:var(--surface);border-top:0;border-left:0;text-align:left}
.cal-day:nth-child(7n){border-right:0}
.cal-day.out{background:var(--surface-2);color:var(--muted)}
.cal-day.today .dn{background:var(--roast);color:var(--roast-ink);border-radius:6px;padding:0 6px}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dn{font-family:var(--f-mono);font-size:12px;align-self:flex-start}
.ev{font-size:11.5px;padding:2px 5px;border-radius:4px;background:var(--accent-soft);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--accent)}
.ev.done{opacity:.55;text-decoration:line-through}
.ev-more{font-size:11px;color:var(--muted)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,15,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:20;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:560px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 6vh - 24px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.modal.wide{max-width:820px}
.modal h2{font-family:var(--f-display);margin:0;font-size:21px;letter-spacing:-.01em}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal .foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.modal .foot > div{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--neg);font-size:13px;font-weight:500}
.hist{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto}
.hist .h{border-left:2px solid var(--line);padding-left:10px}
.hist .h small{color:var(--muted);font-family:var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:500;z-index:30;box-shadow:var(--shadow)}
.stats-row{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:6px}
.stats-row div{display:flex;flex-direction:column}
.stats-row small{color:var(--muted);font-size:12px}
.stats-row b{font-family:var(--f-mono);font-weight:500;font-size:16px}
.bar-h{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.bar-h i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cfg-list .li{grid-template-columns:1fr auto auto}
.note{font-size:12.5px;color:var(--muted)}
.mp-sel{display:flex;align-items:center;justify-content:space-between;gap:10px}.mp-sel b{font-size:15px}
.mpick{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.mp-y{display:flex;align-items:center;gap:8px;margin-bottom:6px}.mp-y b{font-family:var(--f-mono);min-width:44px;text-align:center}
.mp-m{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.mp-m button,.ms{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 4px;cursor:pointer;font-size:13px;text-transform:capitalize;color:var(--ink-2)}
.mp-m button.hoje,.ms.hoje{border-color:var(--muted)}
.mp-m button[aria-pressed="true"],.ms.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mstrip{margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.ms-row{display:flex;gap:4px;align-items:center;overflow-x:auto;padding-bottom:2px}
.ms{padding:6px 10px;white-space:nowrap;font-family:var(--f-mono);font-size:12.5px;text-transform:none}
.parte-row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}.parte-row .seg{flex:none}
.ac{position:relative;flex:1;min-width:200px}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:40;max-height:260px;overflow-y:auto;padding:4px}
.ac-item{padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column}
.ac-item span{font-size:12px;color:var(--muted)}
.ac-item.on,.ac-item:hover{background:var(--accent-soft)}
.ac-novo{border-top:1px solid var(--line-2);margin-top:2px}.ac-novo b{color:var(--accent)}
.novo-parte{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.ac-empty{padding:10px;color:var(--muted);font-size:13px}
.parc-prev{border:1px solid var(--line);border-radius:10px;padding:2px 12px;max-height:220px;overflow-y:auto}
.parc-prev .li{grid-template-columns:60px 1fr auto;padding:6px 0}
.perm{border-collapse:collapse;width:100%}.perm td,.perm th{padding:8px 10px}
.yes{color:var(--pos);font-weight:600}.no{color:var(--muted)}
.u-row{display:grid;grid-template-columns:36px 1fr auto auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.u-row img{width:32px;height:32px;border-radius:50%}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.emp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
@media (max-width:760px){.emp-grid{grid-template-columns:1fr 1fr}.emp-grid .field{grid-column:auto!important}}
.soc-ag{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.modal.relm{max-width:880px}
.ped td{vertical-align:top}.acts-col{white-space:nowrap}.acts-col>div{display:flex;gap:4px;justify-content:flex-end;margin-bottom:4px}.acts-col>div:last-child{flex-direction:column;align-items:flex-end;gap:0}
.rel-wrap{overflow-x:auto;background:#E9E9E6;border-radius:10px;padding:16px}
.rel{width:794px;min-height:1000px;margin:0 auto;background:#fff;color:#141414;font-family:var(--f-body);font-size:12.5px;line-height:1.45;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.rel-h{background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:26px 36px}
.rel-logo{width:170px;height:auto;display:block;flex:none}
.rel-wm{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.01em;color:#fff;max-width:300px;line-height:1.1}
.rel-emp{text-align:right;font-size:11px;color:#d6d6d2;max-width:430px}.rel-emp b{color:#fff;display:block}
.rel-brand{font-family:var(--f-display);font-size:20px;letter-spacing:.04em;margin-bottom:4px}
.rel-title{display:flex;justify-content:space-between;align-items:flex-end;padding:22px 36px 14px;border-bottom:3px solid #BB371A}
.rel-title h1{font-family:var(--f-display);font-size:24px;margin:2px 0 0;letter-spacing:-.01em}
.rel-k{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:#77776f;font-weight:600}
.rel-num{text-align:right;font-size:11px;color:#55554f}.rel-num b{font-family:var(--f-mono);font-size:22px;color:#141414;display:block}
.rel-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.rs{padding:14px 36px 4px}.rel-cols .rs:first-child{padding-right:0}.rel-cols .rs:last-child{padding-left:0}
.rs-t{font-family:var(--f-display);font-weight:700;font-size:13.5px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #e3e3df}
.rkv{border-collapse:collapse;width:100%}.rkv th,.rkv td{padding:3px 0;border:0;background:none;text-transform:none;letter-spacing:0;font-size:12px;vertical-align:top}

.rel-dates{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:12px;background:#F4F4F1;border-radius:6px;padding:10px 12px;margin-bottom:8px}
.rel-dates b{font-family:var(--f-mono);font-size:14px}
.rparc{border-collapse:collapse;width:100%;margin-top:6px}.rparc th,.rparc td{padding:5px 8px;border-bottom:1px solid #ecece9;font-size:11.5px;background:none;text-align:left;text-transform:none;letter-spacing:0}
.rparc th{color:#6f6f6b;font-weight:600;background:#F4F4F1}.rparc .r{text-align:right;font-family:var(--f-mono)}
.rel-bank{margin-top:8px;border-left:3px solid #BB371A;padding:6px 10px;background:#FBF3F0;font-size:11.5px}
.rel-p{margin:0;white-space:pre-wrap}
.rel-sign{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:46px 36px 10px}.rel-sign div{display:flex;flex-direction:column;align-items:center;font-size:11.5px;font-weight:600}
.rel-sign span{width:100%;border-top:1px solid #141414;margin-bottom:6px}.rel-sign small{font-weight:400;color:#6f6f6b}
.doc-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.doc-parc{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.fat-tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding:10px 12px;background:#000;color:#fff;border-radius:6px}.fat-tot b{font-family:var(--f-mono);font-size:18px}
.rec-valor{display:flex;justify-content:space-between;align-items:center;border:2px solid #141414;border-radius:8px;padding:12px 16px;margin:6px 0 16px}.rec-valor b{font-family:var(--f-mono);font-size:22px}
.rec-txt{font-size:13.5px;line-height:1.7;margin:0 0 10px}
.ac-dest{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
a.btn{text-decoration:none}
.ag-acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.note.lock{font-size:12px;color:var(--warn);font-weight:600;white-space:nowrap}
.rel-foot{margin-top:18px;padding:12px 36px;border-top:1px solid #e3e3df;font-size:10px;color:#8a8a84}
.st-info{background:var(--info-bg);color:var(--info)}

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const HOJE = iso(new Date());
const mkey = s => s ? s.slice(0,7) : "";
const addDays = (s,n)=>{ const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const addMonths = (k,n)=>{ let [y,m]=k.split("-").map(Number); m+=n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return y+"-"+pad(m); };
const addMonthsDate = (s,n)=>{ const [y,m,d]=s.split("-").map(Number); const k=addMonths(y+"-"+pad(m),n); const [yy,mm]=k.split("-").map(Number); const last=new Date(yy,mm,0).getDate(); return k+"-"+pad(Math.min(d,last)); };
const mlabel = k => { const [y,m]=k.split("-"); return MESES[+m-1]+"/"+y.slice(2); };
const dBR = s => s ? s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4) : "—";
const dShort = s => s ? s.slice(8,10)+"/"+s.slice(5,7) : "—";
const BRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const BRL0 = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const fmt = c => BRL.format((c||0)/100);
const fmt0 = c => BRL0.format((c||0)/100);
const fmtK = c => { const v=Math.abs(c/100); const s=c<0?"−":""; return v>=1000? s+"R$ "+(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:v>=10000?0:1})+" mil" : s+"R$ "+Math.round(v); };
const pct = (a,b) => b ? (a/b*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%" : "—";
function parseMoney(str){
  if(typeof str==="number") return Math.round(str*100);
  let s=String(str||"").trim().replace(/[R$\s]/g,"");
  if(!s) return NaN;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  const v=Number(s); return isFinite(v)?Math.round(v*100):NaN;
}
const moneyIn = c => c||c===0 ? (c/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}) : "";

function fluxoMeses(ini,n,cc){
  const cur=mkey(HOJE); const out=[];
  for(let i=0;i<n;i++){ out.push({k:addMonths(ini,i),inR:0,outR:0,inP:0,outP:0}); }
  const idx={}; out.forEach((m,i)=>idx[m.k]=i);
  let saldo=0;
  for(const l of S.lanc){
    if(!inCC(l,cc)) continue;
    if(l.pago){ if(mkey(l.pago)<ini){ saldo+=sinal(l); continue; } const i=idx[mkey(l.pago)]; if(i==null) continue; if(l.tipo==="receita") out[i].inR+=l.valor; else out[i].outR+=l.valor; }
    else { let k=mkey(l.venc); if(k<cur) k=cur; const i=idx[k]; if(i==null) continue; if(l.tipo==="receita") out[i].inP+=l.valor; else out[i].outP+=l.valor; }
  }
  for(const m of out){ m.saldoIni=saldo; m.res=m.inR+m.inP-m.outR-m.outP; saldo+=m.res; m.saldoFim=saldo; }
  return out;
}
function dreCalc(ini,fim,regime,cc){
  const meses=[]; for(let k=ini;k<=fim;k=addMonths(k,1)){ meses.push(k); if(meses.length>24) break; }
  const byCat={};
  const byCen={}; centros().forEach(c=>byCen[c.id]={rec:0,gas:0}); byCen[""]={rec:0,gas:0};
  for(const l of S.lanc){
    if(!inCC(l,cc)) continue;
    const dt = regime==="caixa" ? l.pago : (l.venc||l.dataLanc); if(!dt) continue;
    const k = regime==="caixa" ? mkey(dt) : compOf(l); if(k<ini||k>fim) continue;
    const cat=catBy(l.categoria); const g=cat?cat.grupo:(l.tipo==="receita"?"receita":"adm");
    if(g==="invest") continue;
    const v = sinal(l);
    const cid=l.categoria||"_"+l.tipo;
    byCat[cid]=byCat[cid]||{g,m:{},t:0}; byCat[cid].m[k]=(byCat[cid].m[k]||0)+v; byCat[cid].t+=v;
    const bc=byCen[l.centro]?l.centro:""; if(v>0) byCen[bc].rec+=v; else byCen[bc].gas+=-v;
  }
  const gsum=(g,k)=>Object.values(byCat).filter(c=>c.g===g).reduce((a,c)=>a+(k?(c.m[k]||0):c.t),0);
  const calc=k=>{ const r={}; ["receita","deducao","cmv","venda","adm","pessoal","financeiro"].forEach(g=>r[g]=gsum(g,k));
    r.RL=r.receita+r.deducao; r.LB=r.RL+r.cmv; r.RO=r.LB+r.venda+r.adm+r.pessoal; r.RLIQ=r.RO+r.financeiro; return r; };
  const tot=calc(null); const pm={}; meses.forEach(k=>pm[k]=calc(k));
  return {meses,byCat,tot,pm,byCen};
}

  const bar=(x,v1,v2,col,pat)=>{
    let s=""; const base=y(0); const h1=base-y(v1), h2=base-y(v2);

    <pattern id="${elId}hOut" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect width="6" height="6" style="fill:var(--surface)"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--out)" stroke-width="2"/></pattern></defs>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Entradas e saídas por mês">${defs}${g}</svg>`;
  const tip=document.createElement("div"); tip.className="tip"; tip.hidden=true; el.appendChild(tip);

    });

function filtraContas(tipo){

    if(f.status==="abertos"&&l.pago) return false;
    if(f.status==="pagos"&&!l.pago) return false;
    if(f.status==="vencidos"&&statusOf(l)!=="vencido") return false;
    if(f.mes&&mkey(l.venc)!==f.mes) return false;

const bissexto = y => (y%4===0&&y%100!==0)||y%400===0;
function anivDoDia(ds,cc){
  const md=ds.slice(5), y=+ds.slice(0,4); const out=[];
  const bate=d=>{ if(!d||d.length<10) return false; let m=d.slice(5,10); if(m==="02-29"&&!bissexto(y)) m="02-28"; return m===md && +d.slice(0,4)<=y; };

  for(const u of S.usr) if(bate(u.nascimento)){ const nm=nomeUsr(u.id); out.push({tipo:"usr",data:ds,titulo:`Aniversário de ${nm}`,curto:nm}); }
  return out;
}

          <button class="btn sm" data-act="mes" data-n="0">Hoje</button>

          <div class="clk" data-act="edit-ag" data-id="${a.id}"><div class="desc" ${a.concluido?'style="text-decoration:line-through;color:var(--muted)"':''}><span class="tag mot">${esc(motivoNome(a))}</span> ${esc(cenNome(a.lojaId)||"")}${exTag(a)}</div>

/* ---------- recorrências mensais (lançamentos antigos) ---------- */
const HORIZ_REC = 12;
let recBusy=false, recT=null;
function agendarRec(){ clearTimeout(recT); recT=setTimeout(()=>gerarRecorrencias(),800); }
async function gerarRecorrencias(force,only){
  if(recBusy) return;
  if(!force&&(!S.db||nivel("lanc")<2||S.claims.papel==="master_rede"||!(S.loaded.lanc&&S.loaded.rec))) return;
  recBusy=true;
  try{
    const ate=addMonths(mkey(HOJE),HORIZ_REC);
    const lista=only?[only]:S.rec.filter(x=>x.ativa);
    for(const rc of lista){
      const lim = rc.variavel ? addMonths(mkey(HOJE),1) : ate;
      const fim = rc.fim && rc.fim<lim ? rc.fim : lim;
      for(let k=rc.inicio, i=0; k<=fim && i<120; k=addMonths(k,1), i++){
        if((rc.pulados||[]).includes(k)) continue;
        const id=`rec-${rc.id}-${k}`;
        if(S.lanc.some(x=>x.id===id)) continue;
        const [yy,mm]=k.split("-").map(Number); const ult=new Date(yy,mm,0).getDate();
        const venc=rc.vencInicio ? addMonthsDate(rc.vencInicio,i) : k+"-"+pad(Math.min(rc.dia||1,ult));
        const d={tipo:rc.tipo,descricao:rc.descricao,valor:rc.valor||0,venc,dataLanc:venc,competencia:k,pago:null,categoria:rc.categoria,centro:rc.centro||"",forma:rc.forma||"",fornecedorId:rc.fornecedorId||null,obs:rc.obs||"",recId:rc.id,recTipo:rc.variavel?"variavel":"fixa",valorPendente:!!rc.variavel,parcela:"mensal",numero:rc.numero||null,criadoPor:rc.criadoPor||null,criado:new Date().toISOString()};
        await save("lanc",id,d);
        if(!S.lanc.some(x=>x.id===id)) S.lanc.push({...d,id});
      }
    }
  }catch(e){} finally{ recBusy=false; }
}
async function encerrarRec(rc,ultimoMes){
  try{
    await save("rec",rc.id,{...rc,ativa:false,fim:ultimoMes,encerradaEm:new Date().toISOString()});
    const futuros=S.lanc.filter(l=>l.recId===rc.id&&!l.pago&&compOf(l)>ultimoMes);
    for(const l of futuros) await del("lanc",l.id);
    toast(`Recorrência encerrada — último mês ${mlabel(ultimoMes)}`);
  }catch(e){}
}
function recPanel(tipo){
  const rs=S.rec.filter(r=>r.tipo===tipo).sort((a,b)=>(b.ativa-a.ativa)||(a.descricao||"").localeCompare(b.descricao||""));
  if(!rs.length) return "";
  return `<div class="panel" style="margin-top:16px"><h2>Recorrências mensais<small>${rs.filter(r=>r.ativa).length} ativa(s)</small></h2>
    <div class="list">${rs.map(r=>`<div class="li" style="grid-template-columns:1fr auto auto">
      <div><div class="desc">${esc(r.descricao)} ${r.ativa?'<span class="pill st-pago">Ativa</span>':'<span class="pill st-aberto">Encerrada</span>'}</div>
        <div class="meta note">${r.variavel?"Variável":"Fixa"} · todo dia ${r.dia} · desde ${mlabel(r.inicio)}${r.fim?` · até ${mlabel(r.fim)}`:""} · ${esc(catBy(r.categoria)?.nome||"")}${r.centro?" · "+esc(cenNome(r.centro)):""}</div></div>
      <b class="num ${tipo==="receita"?"tipo-r":"tipo-d"}">${r.variavel?(r.valor?"~"+fmt(r.valor)+"/mês":"valor variável"):fmt(r.valor)+"/mês"}</b>
      <span>${r.ativa&&isAdm()?`<button class="btn sm" data-act="rec-enc" data-id="${r.id}">Encerrar</button>`:""}</span></div>`).join("")}</div></div>`;
}

let modalOpen=false;
function openModal(html,wide,onMount,opOk){
  const root=$("#modalRoot");

  modalOpen=true;

  const m=root.querySelector(".modal");

function somenteLeitura(m){
  if(!m) return;

document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&modalOpen) closeModal(); });
$("#modalRoot").addEventListener("mousedown",e=>{ if(e.target.hasAttribute("data-scrim")) closeModal(); });
function confirmBtn(btn,label,fn){

async function criarForn(dados){
  const id=newId("forn"); const codigo=proxCodigo(S.forn,"F");
  const d={...dados,codigo,criado:new Date().toISOString(),criadoPor:(S.me&&S.me.id)||null};
  await save("forn",id,d); if(!S.forn.some(x=>x.id===id)) S.forn.push({...d,id});
  return {...d,id};
}
function buscarForn(q){
  const n=normTxt(q.trim()), dg=digitos(q);
  const all=[...S.forn].sort((a,b)=>fornNome(a).localeCompare(fornNome(b)));
  if(!n) return all.slice(0,8);
  const hit=f=>normTxt([f.codigo,fornNome(f),fornResp(f)].join(" ")).includes(n)||(dg.length>=3&&digitos(f.documento).startsWith(dg));
  const ini=all.filter(f=>normTxt(fornNome(f)).startsWith(n)||normTxt(f.codigo).startsWith(n));
  return [...ini,...all.filter(f=>!ini.includes(f)&&hit(f))].slice(0,8);
}

        list.innerHTML=(res.length?res.map((f,i)=>`<div class="ac-item ${i===hi?"on":""}" role="option" data-i="${i}"><b><span class="num">${esc(f.codigo||"")}</span> ${esc(fornNome(f))}</b><span>${esc([fmtDoc(f.documento),fornResp(f)].filter(Boolean).join(" · "))}</span></div>`).join(""):`<div class="ac-empty">Nenhum fornecedor encontrado.</div>`)
          + (emp.value.trim()?`<div class="ac-item ac-novo" data-novo="1"><b>+ Cadastrar “${esc(emp.value.trim())}” como novo fornecedor</b><span>preencha CPF/CNPJ e os contatos abaixo</span></div>`:"");
        list.hidden=false; emp.setAttribute("aria-expanded","true"); };
      emp.addEventListener("input",()=>{ if(hid.value) return; hi=0; abrir(); updHint(); });
      emp.addEventListener("focus",abrir);
      emp.addEventListener("keydown",e=>{
        if(list.hidden&&e.key==="ArrowDown"){ abrir(); return; }
        if(e.key==="ArrowDown"){ e.preventDefault(); hi=Math.min(res.length-1,hi+1); abrir(); }
        else if(e.key==="ArrowUp"){ e.preventDefault(); hi=Math.max(0,hi-1); abrir(); }
        else if(e.key==="Enter"&&!list.hidden){ e.preventDefault(); if(res[hi<0?0:hi]) lock(res[hi<0?0:hi]); else fechar(); }
        else if(e.key==="Escape"&&!list.hidden){ e.stopPropagation(); fechar(); }
      });
      emp.addEventListener("blur",()=>setTimeout(fechar,150));
      list.addEventListener("mousedown",e=>{ e.preventDefault(); if(e.target.closest("[data-novo]")){ fechar(); doc.focus(); return; } const it=e.target.closest("[data-i]"); if(it) lock(res[+it.dataset.i]); });
      const porDoc=()=>{ if(hid.value) return; const f=fornPorDoc(doc.value); if(f){ lock(f); toast(`Fornecedor ${f.codigo||""} encontrado pelo CPF/CNPJ`); } else updHint(); };
      doc.addEventListener("input",()=>{ if(!hid.value&&[11,14].includes(digitos(doc.value).length)) porDoc(); else updHint(); });
      doc.addEventListener("blur",()=>{ if(!hid.value) doc.value=fmtDoc(doc.value); porDoc(); });
      troca.addEventListener("click",unlock);
      if(fo) lock(fo); else updHint();
      /* parcelas */
      let cond="1", parcs=[];
      const drawParcs=()=>{ const box=$("#lParcs"); if(!box) return;
        box.innerHTML=parcs.length?`<div class="pr pr-h"><span>Parcela</span><span>Data do pagamento</span><span>Valor (R$)</span></div>`+parcs.map((p,i)=>`<div class="pr"><span class="num">${i+1}/${parcs.length}</span><input type="date" data-pi="${i}" data-pf="venc" value="${esc(p.venc)}" aria-label="Data da parcela ${i+1}"><input type="text" inputmode="decimal" data-pi="${i}" data-pf="valor" value="${moneyIn(p.valor)}" aria-label="Valor da parcela ${i+1}"></div>`).join(""):'<div class="note">Informe o valor total, a quantidade e a 1ª data.</div>';
        somaParcs(); };
      const somaParcs=()=>{ const el=$("#lParcSum"); if(!el) return; if(!parcs.length){ el.textContent=""; return; } const s=parcs.reduce((a,p)=>a+(p.valor||0),0), tot=parseMoney($("#lValor").value); el.innerHTML=`Soma das parcelas: <b class="num ${tot>0&&s!==tot?"neg":""}">${fmt(s)}</b>${tot>0&&s!==tot?` — diferente do valor total (${fmt(tot)})`:""}. Você pode ajustar datas e valores de cada parcela.`; };
      const genParcs=()=>{ if(cond!=="p") return; const n=parseInt($("#lN").value)||0, tot=parseMoney($("#lValor").value), d1=$("#lP1").value;
        if(!(n>=2&&n<=60)||!d1){ parcs=[]; drawParcs(); return; }
        const b=tot>0?Math.floor(tot/n):0; parcs=Array.from({length:n},(_,i)=>({venc:addMonthsDate(d1,i),valor:tot>0?(i===n-1?tot-b*(n-1):b):0})); drawParcs(); };
      if(isNew){
        const recPrev=()=>{ if(cond!=="rf"&&cond!=="rv") return; const v=parseMoney($("#lValor").value), r1=$("#lR1").value, fim=$("#lRFim").value;
          $("#lRInfo").innerHTML = cond==="rf" ? "<b>Recorrente fixa:</b> o mesmo valor é lançado todo mês. Para mudar, edite um mês e escolha se vale só para ele, dali em diante ou para todos." : "<b>Recorrente variável:</b> todo mês aparece um lançamento para você digitar o valor daquele mês (direto na lista ou editando). O valor de um mês não altera os outros. O valor acima é só uma estimativa, opcional.";
          if(!r1){ $("#lRPrev").innerHTML=""; return; }
          const n=[]; for(let i=0;i<4;i++){ const d=addMonthsDate(r1,i); if(fim&&mkey(d)>fim) break; n.push(`<div class="li"><span class="num">${mlabel(mkey(d))}</span><span class="num">${dBR(d)}</span><b class="num">${cond==="rf"?(v>0?fmt(v):"—"):(v>0?"~"+fmt(v):"a informar")}</b></div>`); }
          $("#lRPrev").innerHTML=n.join("")+`<div class="note" style="padding:6px 0">${fim?"até "+mlabel(fim):"… e assim por diante, até ser encerrada"}</div>`; };
        const setCond=c=>{ cond=c; m.querySelectorAll("[data-cd]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.cd===c)); $("#lAV").hidden=c!=="1"; $("#lPC").hidden=c!=="p"; $("#lRC").hidden=!(c==="rf"||c==="rv"); if(c==="p") genParcs();
          $("#lValorLbl").textContent = c==="rf"?"Valor mensal (R$)":c==="rv"?"Valor estimado por mês (R$) — opcional":c==="p"?"Valor total (R$)":"Valor total (R$)"; recPrev(); };
        $("#lR1").addEventListener("change",recPrev); $("#lRFim").addEventListener("change",recPrev); $("#lValor").addEventListener("input",recPrev);
        m.querySelectorAll("[data-cd]").forEach(b=>b.addEventListener("click",()=>setCond(b.dataset.cd)));
        $("#lN").addEventListener("input",genParcs); $("#lP1").addEventListener("change",genParcs); $("#lValor").addEventListener("input",()=>{ if(cond==="p") genParcs(); });
        $("#lParcs").addEventListener("input",e=>{ const t=e.target; if(!t.dataset.pi) return; const p=parcs[+t.dataset.pi]; if(!p) return; if(t.dataset.pf==="venc") p.venc=t.value; else { const v=parseMoney(t.value); p.valor=isFinite(v)?v:0; } somaParcs(); });
      }
      /* excluir */
      const bd=$("#lDel"); if(bd) bd.addEventListener("click",()=>confirmBtn(bd,"Confirmar exclusão",async()=>{ try{ const rc=l.recId&&S.rec.find(x=>x.id===l.recId); if(rc) await save("rec",rc.id,{...rc,pulados:[...new Set([...(rc.pulados||[]),compOf(l)])]}); await del("lanc",l.id); closeModal(); toast("Lançamento excluído"); }catch(e){} }));
      const bda=$("#lDelAll"); if(bda) bda.addEventListener("click",()=>confirmBtn(bda,`Confirmar: excluir ${grp.length}`,async()=>{ bda.disabled=true; try{ const rc=l.recId&&S.rec.find(x=>x.id===l.recId); if(rc) await del("rec",rc.id); for(const x of grp) await del("lanc",x.id); closeModal(); toast(`${grp.length} lançamentos excluídos`); }catch(e){ bda.disabled=false; } }));
      const be=$("#lEnc"); if(be) be.addEventListener("click",()=>confirmBtn(be,`Confirmar: último mês ${mlabel(compOf(l))}`,async()=>{ const rc=recBy(l); if(rc){ await encerrarRec(rc,compOf(l)); closeModal(); } }));
      /* salvar */
      $("#fL").addEventListener("submit",async e=>{
        e.preventDefault();
        const err=$("#lErr"); err.textContent="";
        const tipo=T(), desc=$("#lDesc").value.trim(), valor=parseMoney($("#lValor").value), dataLanc=$("#lData").value;
        const fail=(msg,el)=>{ err.textContent=msg; if(el) el.focus(); return false; };
        if(!desc) return fail("Informe o assunto do lançamento.",$("#lDesc"));
        let fid=hid.value||null, novoForn=false;
        const algumForn=campos.some(c=>c.value.trim());
        if(!fid&&algumForn){ if(!fornValidate("lf",err)) return; const dup=fornPorDoc(doc.value); if(dup) fid=dup.id; else novoForn=true; }
        if(!fid&&!novoForn&&tipo==="despesa") return fail("Informe o fornecedor da despesa (empresa e CPF/CNPJ).",emp);
        if(!$("#lCat").value) return fail("Escolha a categoria — ela define onde o valor entra no DRE.",$("#lCat"));
        if(!$("#lCen").value) return fail("Escolha o centro de custo (Matriz ou uma loja).",$("#lCen"));
        if(!dataLanc) return fail("Informe a data do lançamento.",$("#lData"));
        if(!$("#lForma").value) return fail("Escolha a forma de pagamento.",$("#lForma"));
        const varv = isNew ? cond==="rv" : ehVariavel(l);
        if(varv){ if($("#lValor").value.trim()&&!(valor>=0)) return fail("Valor inválido — use números, ex.: 1.250,00.",$("#lValor")); }
        else if(!(valor>0)) return fail("Informe um valor maior que zero, por exemplo 1.250,00.",$("#lValor"));
        if(isNew&&(cond==="rf"||cond==="rv")){ if(!$("#lR1").value) return fail("Informe a data do 1º pagamento.",$("#lR1")); if($("#lRFim").value&&$("#lRFim").value<mkey($("#lR1").value)) return fail("O último mês não pode ser antes do 1º pagamento.",$("#lRFim")); }
        const venc=$("#lVenc")?$("#lVenc").value:"";
        if(isNew&&cond==="1"&&!venc) return fail("Informe a data de pagamento.",$("#lVenc"));
        if(isNew&&cond==="p"){
          const n=parseInt($("#lN").value)||0;
          if(!(n>=2&&n<=60)) return fail("Quantidade de parcelas: entre 2 e 60.",$("#lN"));
          if(parcs.length!==n) genParcs();
          if(parcs.some(p=>!p.venc)) return fail("Preencha a data de todas as parcelas.");
          if(parcs.some(p=>!(p.valor>0))) return fail("Todas as parcelas precisam ter valor maior que zero.");
          const s=parcs.reduce((a,p)=>a+p.valor,0); if(s!==valor) return fail(`A soma das parcelas (${fmt(s)}) precisa ser igual ao valor total (${fmt(valor)}).`);
        }
        if(!isNew&&!venc) return fail("Informe a data de pagamento.",$("#lVenc"));
        const btn=e.submitter||m.querySelector("button[type=submit]"); btn.disabled=true;
        try{
          let fnovo=null;
          if(novoForn){ fnovo=await criarForn(fornFieldsRead("lf")); fid=fnovo.id; }
          const base={tipo,descricao:desc,categoria:$("#lCat").value,centro:$("#lCen").value,forma:$("#lForma").value,fornecedorId:fid,obs:$("#lObs").value.trim(),dataLanc,competencia:mkey(dataLanc)};
          const qtdV=(tipo==="receita"&&l&&+l.qtdVendas)||0;
          if(!isNew){
            const vOk = varv ? (valor>0?valor:(l.valor||0)) : valor;
            const upd={...base,valor:vOk,venc,pago:$("#lPago").value||null,qtdVendas:qtdV};
            if(varv&&valor>0) upd.valorPendente=false;
            if(l.recId){ upd.competencia=l.competencia||mkey(venc); upd.dataLanc=l.dataLanc||venc; }
            if(btn.dataset.scope==="all"||btn.dataset.scope==="next"){ const n=await salvarSerie(l,upd,btn.dataset.scope); toast(`Alteração aplicada em ${n} lançamento(s)${btn.dataset.scope==="next"?" — deste mês em diante":""}`); }
            else { await save("lanc",l.id,{...l,...upd,atualizado:new Date().toISOString()}); toast("Alterações salvas"); }
          } else {
            const numero=proxNumero(), criado=new Date().toISOString(), criadoPor=(S.me&&S.me.id)||null;
            if(cond==="rf"||cond==="rv"){
              const r1=$("#lR1").value, rid_=newId("rec");
              const recDoc={tipo,descricao:desc,categoria:base.categoria,centro:base.centro,forma:base.forma,fornecedorId:fid,obs:base.obs,valor:valor>0?valor:0,variavel:cond==="rv",dia:+r1.slice(8,10),inicio:mkey(r1),vencInicio:r1,ativa:true,fim:$("#lRFim").value||null,pulados:[],numero,criadoPor,criado};
              await save("rec",rid_,recDoc);
              if(!S.rec.some(x=>x.id===rid_)) S.rec.push({...recDoc,id:rid_});
              await gerarRecorrencias(true,{...recDoc,id:rid_});
            } else if(cond==="1"){
              await save("lanc",newId("lanc"),{...base,qtdVendas:qtdV,valor,venc,pago:$("#lJaPago").checked?venc:null,numero,parcela:"",criadoPor,criado});
            } else {
              const g=rid();
              for(let i=0;i<parcs.length;i++) await save("lanc",newId("lanc"),{...base,qtdVendas:i===0?qtdV:0,valor:parcs[i].valor,venc:parcs[i].venc,pago:null,numero,parcela:`${i+1}/${parcs.length}`,grupoRec:g,criadoPor,criado});
            }
            toast(`Lançamento #${numero} salvo${cond==="p"?` em ${parcs.length} parcelas`:cond==="rf"?" — recorrente fixa, gerada mês a mês":cond==="rv"?" — recorrente variável: informe o valor a cada mês":""}${fnovo?` · fornecedor ${fnovo.codigo} cadastrado`:""}`);
          }
          closeModal();
        }catch(ex){ btn.disabled=false; }
      });
    }, isNew);
}

/* ---------- compromisso ---------- */
function responsaveis(extra){
  let ids=S.usr.map(u=>u.id);
  if(!ids.length&&S.me&&S.me.id) ids=[S.me.id];
  if(extra&&!ids.includes(extra)) ids.push(extra);
  return ids.map(id=>({id,nome:S.names[id]||(S.me&&S.me.id===id&&S.me.name)||"Usuário"})).sort((a,b)=>a.nome.localeCompare(b.nome));
}

    </form>`,false,()=>{

      $("#fA").addEventListener("submit",async e=>{ e.preventDefault();

async function gerarXlsx(rep){
  await loadLib(LIB_XLSX,()=>window.XLSX&&window.XLSX.utils);
  const X=window.XLSX;
  const aoa=[[rep.title],[rep.sub],[`Gerado em ${new Date().toLocaleString("pt-BR")}${S.me&&S.me.name?" por "+S.me.name:""}`],[],rep.cols.map(c=>c.h)];
  const money=[];
  rep.rows.forEach(r=>{ const ri=aoa.length; aoa.push(r.c.map((v,ci)=>{ if(v&&typeof v==="object"){ money.push([ri,ci]); return (v.m||0)/100; } return v==null?"":v; })); });
  const ws=X.utils.aoa_to_sheet(aoa);
  money.forEach(([r,c])=>{ const a=X.utils.encode_cell({r,c}); if(ws[a]) ws[a].z='"R$" #,##0.00;[Red]-"R$" #,##0.00'; });
  ws["!cols"]=rep.cols.map((c,i)=>({wch:i===0&&!c.h?26:Math.max(9,Math.round(c.w*1.25))}));
  const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,(rep.sheet||"Relatório").slice(0,31));
  const buf=X.write(wb,{bookType:"xlsx",type:"array"});

}
async function relatorio(k,formato,btn){
  if(!S.dl){ toast("Download indisponível nesta visualização."); return; }
  const custom={dash:pdfDashboard,fluxo:pdfFluxo,dre:pdfDre}[k];
  const rep=(formato==="pdf"&&custom)?null:reportData(k); if(!rep&&!(formato==="pdf"&&custom)) return;
  const old=btn?btn.innerHTML:""; if(btn){ btn.disabled=true; btn.textContent="Gerando…"; }
  try{
    let blob,file;
    if(formato==="pdf"&&custom){ const r=await custom(); blob=r.blob; file=r.file; }
    else { blob = formato==="pdf" ? await gerarPdf(rep) : await gerarXlsx(rep); file=rep.file; }
    await S.dl.save({filename:file+(formato==="pdf"?".pdf":".xlsx"),data:blob});
  }catch(e){
    const c=e&&e.code;
    if(c==="declined"||c==="cancelled"){}
    else if(c==="rate_limited") toast("Já existe um download aguardando confirmação.");
    else if(c==="extension_not_enabled") toast("Esse formato de arquivo não está disponível nesta visualização.");
    else toast("Não foi possível gerar o arquivo. Tente de novo.");
  }finally{ if(btn&&btn.isConnected){ btn.disabled=false; btn.innerHTML=old; } }
}

function sbErro(e){ const x=new Error(msgErro(e)); x.code=(e&&(e.code==="42501"||/row-level security|permission denied/i.test(e.message||"")))?"permission-denied":(e&&e.code); return x; }
async function buscar(tab,f){
  const out=[]; let de=0; const lote=1000;
  for(;;){
    let q=FB.sb.from(tab).select(f.cols||"id,tid,data");
    if(f.tid) q=q.eq("tid",f.tid); if(f.id) q=q.eq("id",f.id); (f.eq||[]).forEach(([c,v])=>{ q=q.eq(c,v); });
    if(f.ordem) q=q.order(f.ordem[0],{ascending:f.ordem[1]});
    const n=f.limite?Math.min(f.limite-out.length,lote):lote; q=q.range(de,de+n-1);
    const {data,error}=await q; if(error) throw sbErro(error);
    out.push(...data); if(data.length<n||(f.limite&&out.length>=f.limite)) break; de+=n;
  }
  return out;
}
const VIGIAS=new Set();
// depois de gravar, recarrega na hora o que mudou (o tempo real do Supabase complementa)
function atualizarTabelas(...tabs){ VIGIAS.forEach(v=>{ if(tabs.includes(v.tab)) v.agendar(); }); }
function vigiar(tab,f,cb,filtro){
  let vivo=true, t=null;
  const carregar=async()=>{ try{ const rows=await buscar(tab,f); if(vivo) cb(rows); }catch(e){ console.warn("dados",tab,e.message); } };
  const agendar=()=>{ clearTimeout(t); t=setTimeout(carregar,250); };
  const reg={tab,agendar}; VIGIAS.add(reg);
  const ch=FB.sb.channel("rt"+(++chN)+"-"+tab); const flt=filtro?{filter:filtro}:{};
  ch.on("postgres_changes",{event:"INSERT",schema:"public",table:tab,...flt},agendar)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:tab,...flt},agendar)
    .on("postgres_changes",{event:"DELETE",schema:"public",table:tab},agendar).subscribe();
  carregar();
  return ()=>{ vivo=false; clearTimeout(t); VIGIAS.delete(reg); try{ FB.sb.removeChannel(ch); }catch(e){} };
}

      delete:async()=>{ const {error}=await FB.sb.from(tab).delete().eq("id",id); if(error) throw sbErro(error); atualizarTabelas(tab,"tenants"); },
      update:async p=>{ const {data:r,error:e1}=await FB.sb.from(tab).select("data").eq("id",id).maybeSingle(); if(e1) throw sbErro(e1);

const diasTxt = t => { const ms=tsMs(t); if(!ms) return "nunca acessou"; const d=Math.floor((Date.now()-ms)/864e5); return d<=0?"acessou hoje":d===1?"acessou ontem":`acessou há ${d} dias`; };
function redeFiltrada(){ const reg=ui.rreg||""; return S.tenants.filter(t=>!reg||String((t.matriz&&t.matriz.regional)||"")===reg); }
function somaRes(mes,campo,tids,filtro){ let t=0; for(const r of S.resumos){ if(!tids.has(r.tid)) continue; if(mes&&r.mes!==mes) continue; if(filtro&&!filtro(r.mes)) continue; t+=(+r[campo]||0); } return t; }
function fluxoRede(tids){
  const cur=mkey(HOJE), out=[];
  const venc=k=>somaRes(null,k,tids,m=>m<cur);
  for(let i=-3;i<3;i++){ const k=addMonths(cur,i); const m={k,inR:somaRes(k,"recebido",tids),outR:somaRes(k,"pago",tids),inP:k>=cur?somaRes(k,"abRec",tids)+(k===cur?venc("abRec"):0):0,outP:k>=cur?somaRes(k,"abPag",tids)+(k===cur?venc("abPag"):0):0}; m.res=m.inR+m.inP-m.outR-m.outP; out.push(m); }
  return out;
}
function vPainelRede(){

  const rk=tens.map(t=>{ const f=somaRes(cur,"fat",new Set([t.id])), fa=somaRes(ant,"fat",new Set([t.id])), r=somaRes(cur,"rec",new Set([t.id]))-somaRes(cur,"desp",new Set([t.id])); return {t,f,fa,v:fa?(f-fa)/fa*100:null,r}; }).sort((a,b)=>b.f-a.f);
  const porReg={}; tens.forEach(t=>{ const r=String((t.matriz&&t.matriz.regional)||"Sem regional"); porReg[r]=(porReg[r]||0)+somaRes(cur,"fat",new Set([t.id])); });

      `<div class="field"><label for="rrSel">Regional</label><select id="rrSel">${opt("","Todas as regionais",ui.rreg||"")}${regs.map(r=>opt(r,"Regional "+r,ui.rreg||"")).join("")}</select></div><button class="btn" data-act="recalc" title="Busca os números mais recentes de todos os franqueados">Atualizar números</button>`)

const TIPOS_CH=["Corrigir lançamentos","Contas a pagar / receber","Cadastrar ou editar lojas","Fornecedores","Agenda","Usuários do franqueado","Plano de contas","Outro"];
const DUR_CH=[[1,"1 hora"],[4,"4 horas"],[24,"24 horas"],[72,"3 dias"],[168,"7 dias"]];

function statusCh(c){
  const am=S.tenant&&S.tenant.acessoMaster;
  if(c.status==="aprovado"){ if(am&&am.chamadoId===c.id&&tsMs(am.ate)>Date.now()) return ["Liberado","st-pago"]; return tsMs(c.validoAte)<=Date.now()?["Expirado","st-aberto"]:["Encerrado","st-aberto"]; }
  return ({pendente:["Aguardando autorização","st-vence"],negado:["Negado","st-vencido"],cancelado:["Cancelado","st-aberto"],encerrado:["Encerrado","st-aberto"]})[c.status]||[c.status,"st-aberto"];
}
function bannerAcesso(){
  if(!S.tid||!S.tenant) return "";
  const am=S.tenant.acessoMaster, lib=am&&tsMs(am.ate)>Date.now();
  const pend=S.cham.filter(c=>c.status==="pendente");
  if(S.claims.papel==="observador") return `<div class="banner ro-banner">Modo observador — somente leitura. Nada pode ser editado ou excluído.</div>`;
  if(masterRede()) return lib ? `<div class="banner lib-banner">Edição autorizada pelo franqueado até <b>${dtHora(am.ate)}</b> (chamado #${esc(am.numero||"")}). Todas as alterações ficam registradas no Diário. <button class="btn sm" data-act="encerrar-acesso">Encerrar agora</button></div>`
    : `<div class="banner ro-banner">Você está em modo leitura (pode editar só a matriz, em Lojas). ${pend.length?`Há ${pend.length} solicitação(ões) aguardando o franqueado.`:""} <button class="btn sm" data-act="novo-chamado">Solicitar autorização de edição</button></div>`;
  if(masterFranq()&&pend.length) return `<div class="banner lib-banner">A franqueadora solicitou autorização de edição: <b>${esc(pend[0].tipo)}</b> — ${esc(pend[0].descricao)} <button class="btn sm pri" data-act="ver-chamados">Ver e responder</button></div>`;
  if(gestorFranq()&&lib) return `<div class="banner info">A franqueadora está com acesso de edição até ${dtHora(am.ate)} (chamado #${esc(am.numero||"")}). ${masterFranq()?`<button class="btn sm" data-act="encerrar-acesso">Encerrar acesso</button>`:""}</div>`;

async function responderChamado(c,status){

  try{ const {error}= status==="negado" ? await FB.sb.rpc("negar_chamado",{p_id:c.id,p_motivo:motivo||""}) : await FB.sb.rpc("cancelar_chamado",{p_id:c.id});
    if(error) throw new Error(msgErro(error)); atualizarTabelas("chamados","diario","tenants"); toast(status==="negado"?"Solicitação negada":"Solicitação cancelada"); }
  catch(ex){ toast("Não foi possível concluir: "+(ex.message||"")); }
}

    <div class="row"><div class="field"><label for="coN">Nome completo</label><input id="coN" value="${esc(u.nome||"")}"></div>
      <div class="field"><label for="coC">CPF (login)</label><input id="coC" inputmode="numeric" value="${esc(u.login?fmtDoc(u.login):"")}" ${novo?"":"disabled"} placeholder="000.000.000-00"></div></div>
    <div class="row3"><div class="field"><label for="coT">Telefone</label><input id="coT" type="tel" value="${esc(u.telefone||"")}" placeholder="(11) 90000-0000"></div>
      <div class="field"><label for="coE">E-mail</label><input id="coE" type="email" value="${esc(u.email||"")}"></div>
      <div class="field"><label for="coD">Data de nascimento</label><input id="coD" type="date" value="${esc(u.nascimento||"")}"></div></div>
    ${novo?`<div class="sect">Senha de acesso</div>
    <div class="row"><div class="field"><label for="coS">Senha</label><input id="coS" type="text" autocomplete="off" placeholder="Deixe em branco para gerar automaticamente"></div>
      <div class="field"><span class="flabel">&nbsp;</span><label class="chkline"><input type="checkbox" id="coTr" checked> Pedir para o colaborador trocar no 1º acesso</label></div></div>
    <p class="note" style="margin:-4px 0 0">Mínimo de 8 caracteres, com letras e números. O e-mail é usado se ele esquecer a senha.</p>`:`<label class="chkline" style="padding-top:0"><input type="checkbox" id="coA" ${u.ativo===false?"":"checked"}> Acesso ativo (desmarque para bloquear sem excluir)</label>`}
    <div class="sect">O que este colaborador acessa</div>
    ${permGrid(u.perm)}
    <div class="err" id="coErr" role="alert"></div>
    <div class="foot"><div></div><div><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri">${novo?"Criar acesso":"Salvar alterações"}</button></div></div></form>`,true,m=>{
    $("#coC").addEventListener("blur",e=>{ e.target.value=fmtDoc(e.target.value); });
    m.querySelectorAll("[data-pm]").forEach(b=>b.addEventListener("click",()=>{ const l=+b.dataset.pm; MODS_COLAB.forEach(([k,,,mx])=>{ const r=m.querySelector(`input[name="pm_${k}"][value="${Math.min(l,mx)}"]`); if(r) r.checked=true; }); }));
    $("#fCo").addEventListener("submit",async e=>{ e.preventDefault(); const err=$("#coErr"); err.textContent="";
      const d={nome:$("#coN").value.trim(),telefone:$("#coT").value.trim(),email:$("#coE").value.trim(),nascimento:$("#coD").value||null,perm:lerPerm()};
      if(!d.nome){ err.textContent="Informe o nome."; $("#coN").focus(); return; }
      if(novo&&digitos($("#coC").value).length!==11){ err.textContent="Informe o CPF com 11 dígitos — ele é o login."; $("#coC").focus(); return; }
      if(!/^\S+@\S+\.\S+$/.test(d.email)){ err.textContent="Informe um e-mail válido."; $("#coE").focus(); return; }
      if(!MODS_COLAB.some(([k])=>d.perm[k]>0)){ err.textContent="Libere pelo menos uma tela para o colaborador."; return; }
      const b=e.submitter; b.disabled=true;
      try{
        if(novo){ const sn=$("#coS").value.trim(); if(sn&&senhaFraca(sn)){ err.textContent="A senha precisa de pelo menos 8 caracteres, com letras e números."; b.disabled=false; return; }
          const r=await chamar("criarUsuario",{tid:S.tid,...d,cpf:digitos($("#coC").value),senha:sn||undefined,trocar:$("#coTr").checked}); credenciais(`Acesso criado — ${d.nome}`,r); }
        else { await chamar("editarUsuario",{uid:u.id,...d,ativo:$("#coA").checked}); closeModal(); toast("Colaborador atualizado — os acessos já valem"); }
      }catch(ex){ err.textContent=ex.message; b.disabled=false; } }); },"all");
}
function senhaColabModal(u){
  openModal(`<h2>Nova senha — ${esc(u.nome||"")}</h2><form id="fSc" class="fcol" novalidate>
    <div class="field"><label for="scS">Nova senha</label><input id="scS" type="text" autocomplete="off" placeholder="Deixe em branco para gerar automaticamente"></div>
    <label class="chkline" style="padding-top:0"><input type="checkbox" id="scT" checked> Pedir para trocar no próximo acesso</label>
    <p class="note" style="margin:0">Mínimo de 8 caracteres, com letras e números. A senha antiga deixa de funcionar na hora.</p>
    <div class="err" id="scErr" role="alert"></div>
    <div class="foot"><div></div><div><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri">Definir senha</button></div></div></form>`,false,()=>{
    $("#fSc").addEventListener("submit",async e=>{ e.preventDefault(); const sn=$("#scS").value.trim(); if(sn&&senhaFraca(sn)){ $("#scErr").textContent="A senha precisa de pelo menos 8 caracteres, com letras e números."; return; }
      const b=e.submitter; b.disabled=true;
      try{ const r=await chamar("novaSenhaTemp",{uid:u.id,senha:sn||undefined,trocar:$("#scT").checked}); credenciais(`Nova senha — ${u.nome}`,r); }catch(ex){ $("#scErr").textContent=ex.message; b.disabled=false; } }); },"all");
}

/* ---------- plano de contas da rede (categorias base) ---------- */
function vPlanoRede(){
  const base=catsBase(); const oficial=!!(S.planoRede&&Array.isArray(S.planoRede.categorias)&&S.planoRede.categorias.length);
  return header("Plano de contas da rede","Categorias padrão de todos os franqueados. Eles veem com cadeado 🔒 e não podem alterar nem excluir — podem apenas criar categorias próprias. Com o mesmo plano em toda a rede, o DRE e o painel ficam comparáveis.",`<button class="btn pri" data-act="pr-cat">+ Nova categoria base</button>`)
   + (oficial?`<div class="banner info">${base.length} categorias base · atualizado em ${esc(S.planoRede.atualizado?dBR(S.planoRede.atualizado.slice(0,10)):"—")} por ${esc(S.planoRede.atualizadoPor||"—")}</div>`
      :`<div class="banner info">A rede ainda usa as categorias padrão do sistema (${base.length}). Assim que você criar, editar ou excluir uma categoria aqui, esta lista passa a ser o plano oficial da rede.</div>`)
   + `<div class="grid g2e"><div class="panel">${GRUPOS.map(g=>{ const cs=base.filter(x=>x.grupo===g.id); return `<div class="flabel" style="margin-top:12px">${g.nome}</div><div class="list cfg-list">${cs.map(x=>`<div class="li"><span>🔒 ${esc(x.nome)}</span><span class="${x.tipo==="receita"?"tipo-r":"tipo-d"}" style="font-size:12px">${x.tipo}</span><button class="icon-btn" data-act="pr-cat" data-id="${esc(x.id)}">Editar</button></div>`).join("")||'<div class="note">—</div>'}</div>`; }).join("")}</div>
     <div class="panel" style="align-self:start"><h2>Como funciona</h2><ol class="steps">
       <li>As categorias base aparecem para todos os franqueados, com cadeado.</li>
       <li>O franqueado pode criar categorias <b>próprias</b> em Configurações — elas valem só para ele.</li>
       <li>Ao <b>renomear</b> uma categoria base, o novo nome aparece para todos e os lançamentos antigos continuam ligados a ela.</li>
       <li>Evite <b>excluir</b>: lançamentos que já usam a categoria passam a aparecer como “Sem categoria” no DRE.</li></ol></div></div>`;
}
async function salvarPlano(lista,acao){
  const limpa=lista.map(({id,nome,tipo,grupo})=>({id,nome,tipo,grupo}));
  const {error}=await FB.sb.from("rede_config").upsert({id:"plano",data:{categorias:limpa,atualizado:new Date().toISOString(),atualizadoPor:S.me.name}});
  if(error) throw sbErro(error); atualizarTabelas("rede_config");
  diarioRede("Plano de contas da rede alterado",acao);
}
function planoCatModal(id){
  const lista=catsBase().map(x=>({...x})); const it=lista.find(x=>x.id===id); const novo=!it; const x=it||{tipo:"despesa",grupo:"adm"};
  openModal(`<h2>${novo?"Nova categoria base":"Editar categoria base"}</h2><form id="fPr" class="fcol" novalidate>
    <div class="field"><label for="prN">Nome</label><input id="prN" value="${esc(x.nome||"")}"></div>
    <div class="row"><div class="field"><label for="prT">Tipo</label><select id="prT">${opt("receita","Receita",x.tipo)}${opt("despesa","Despesa",x.tipo)}</select></div>
      <div class="field"><label for="prG">Linha do DRE</label><select id="prG">${GRUPOS.map(g=>opt(g.id,g.nome,x.grupo)).join("")}</select></div></div>
    <p class="note" style="margin:0">Vale para todos os franqueados na hora.</p>
    <div class="err" id="prErr" role="alert"></div>
    <div class="foot"><div>${novo?"":`<button type="button" class="btn danger" id="prDel">Excluir</button>`}</div><div><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri">Salvar</button></div></div></form>`,false,()=>{
    const bd=$("#prDel"); if(bd) bd.addEventListener("click",()=>confirmBtn(bd,"Confirmar: lançamentos que usam ficam “Sem categoria”",async()=>{ try{ await salvarPlano(lista.filter(y=>y.id!==id),`Excluída: ${x.nome}`); closeModal(); toast("Categoria base excluída"); }catch(ex){ $("#prErr").textContent=ex.message; } }));
    $("#fPr").addEventListener("submit",async e=>{ e.preventDefault(); const nome=$("#prN").value.trim(); if(!nome){ $("#prErr").textContent="Informe o nome."; return; }
      if(lista.some(y=>y.id!==id&&normTxt(y.nome)===normTxt(nome)&&y.tipo===$("#prT").value)){ $("#prErr").textContent="Já existe uma categoria base com esse nome."; return; }
      const n={id:x.id||("rb_"+rid()),nome,tipo:$("#prT").value,grupo:$("#prG").value};
      const nl=novo?[...lista,n]:lista.map(y=>y.id===id?n:y);
      try{ await salvarPlano(nl,novo?`Criada: ${nome}`:`Editada: ${x.nome}${x.nome!==nome?" → "+nome:""}`); closeModal(); toast("Plano de contas da rede atualizado"); }catch(ex){ $("#prErr").textContent=ex.message; } }); },"all");
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const nav=e.target.closest("[data-nav]"); if(nav){ if(nav.hasAttribute("data-close")) closeModal(); ui.view=nav.dataset.nav; saveUi(); render(); window.scrollTo(0,0); return; }
  const f=e.target.closest("[data-f]"); if(f&&!$("#modalRoot").contains(f)){ const [g,k]=f.dataset.f.split("."); ui[g][k]=f.dataset.v; render(); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const id=a.dataset.id; const act=a.dataset.act;
  const ESCRITA=["new-lanc","baixar","estornar","new-forn","new-ag","toggle-ag","new-loja","edit-cat","cfg-default","rm-ex","rec-enc"];
  if(S.role==="ro"&&ESCRITA.includes(act)){ toast(masterRede()?"Somente leitura — solicite autorização ao franqueado em Chamados.":"Somente leitura."); return; }
  if(act==="sair"){ if(S.tid&&!plat()) await diario("Logout",`${S.me.name} saiu do sistema`,{cat:"acesso"}); FB.sb.auth.signOut(); return; }
  if(act==="trocar-senha"){ trocarSenhaModal(); return; }
  if(act==="entrar-tenant"){ abrirTenant(id); window.scrollTo(0,0); return; }
  if(act==="voltar-rede"){ abrirTenant(null); return; }
  if(act==="pr-cat"&&masterRede()&&!S.tid){ planoCatModal(id); return; }
  if(act==="franq-ativo"&&masterRede()){ const suspender=a.dataset.v!=="1"; confirmBtn(a,suspender?"Confirmar: bloquear logins":"Confirmar reativação",async()=>{ a.disabled=true; try{ await chamar("alterarFranqueado",{tid:id,ativo:!suspender}); toast(suspender?"Franqueado suspenso — logins bloqueados":"Franqueado reativado"); }catch(ex){ toast(ex.message); a.disabled=false; } }); return; }
  if(act==="recalc"&&masterRede()){ (async()=>{ a.disabled=true; a.textContent="Atualizando…"; try{ const r=await chamar("recalcularIndicadores",{}); toast("Números da rede atualizados"); }catch(ex){ toast(ex.message); } finally{ a.disabled=false; a.textContent="Atualizar números"; } })(); return; }
  if(act==="novo-franq"&&masterRede()){ novoFranqModal(); return; }
  if(act==="nova-conta-rede"&&masterRede()){ novaContaRedeModal(a.dataset.papel); return; }
  if(act==="rede-senha"&&masterRede()){ confirmBtn(a,"Confirmar",async()=>{ try{ const r=await chamar("novaSenhaTemp",{uid:id}); credenciais("Nova senha temporária",r); }catch(ex){ toast(ex.message); } }); return; }
  if(act==="rede-ativo"&&masterRede()){ confirmBtn(a,"Confirmar",async()=>{ try{ await chamar("alterarContaRede",{uid:id,ativo:a.dataset.v==="1"}); toast("Acesso atualizado"); }catch(ex){ toast(ex.message); } }); return; }
  if(act==="novo-chamado"&&masterRede()){ novoChamadoModal(); return; }
  if(act==="ver-chamados"){ ui.view="chamados"; render(); return; }
  if(act==="ch-autorizar"&&masterFranq()){ const c=S.cham.find(x=>x.id===id); if(c) autorizarModal(c); return; }
  if(act==="ch-negar"&&masterFranq()){ const c=S.cham.find(x=>x.id===id); if(c) responderChamado(c,"negado"); return; }
  if(act==="ch-cancelar"&&masterRede()){ const c=S.cham.find(x=>x.id===id); if(c) confirmBtn(a,"Confirmar cancelamento",()=>responderChamado(c,"cancelado")); return; }
  if(act==="encerrar-acesso"&&(masterFranq()||masterRede())){ confirmBtn(a,"Confirmar encerramento",encerrarAcesso); return; }
  if(act==="novo-usuario"&&(gestorFranq()||(masterRede()&&S.liberado))){ colabModal(null); return; }
  if(act==="edit-colab"&&(gestorFranq()||(masterRede()&&S.liberado))){ const u=S.usr.find(x=>x.id===id); if(u) colabModal(u); return; }
  if(act==="usr-senha"&&(gestorFranq()||(masterRede()&&S.liberado))){ const u=S.usr.find(x=>x.id===id); if(u) senhaColabModal(u); return; }
  if(act==="new-lanc") lancForm(null,a.dataset.tipo);
  else if(act==="edit-lanc"){ const l=S.lanc.find(x=>x.id===id); if(l) lancForm(l); }
  else if(act==="baixar"&&isAdm()){ const l=S.lanc.find(x=>x.id===id); if(l) baixar(l); }
  else if(act==="estornar"&&isAdm()){ const l=S.lanc.find(x=>x.id===id); if(l) confirmBtn(a,"Confirmar estorno",async()=>{ try{ await save("lanc",l.id,{...l,pago:null}); toast("Baixa estornada"); }catch(ex){} }); }
  else if(act==="clear-c"){ ui.c={status:"todos",mes:"",q:"",mesBase:ui.c.mesBase}; render(); }
  else if(act==="clear-l"){ ui.l={tipo:"todos",mes:"",q:""}; render(); }
  else if(act==="ms-sel"){ ui.c.mes=a.dataset.k; render(); }
  else if(act==="ms-nav"){ ui.c.mesBase=addMonths(ui.c.mesBase||mkey(HOJE),+a.dataset.n); render(); }
  else if(act==="new-forn") fornForm(null);
  else if(act==="edit-forn"){ const x=fornBy(id); if(x) fornForm(x); }
  else if(act==="new-ag") agForm(null,a.dataset.d);
  else if(act==="edit-ag"){ const x=S.ag.find(y=>y.id===id); if(x) agForm(x); }
  else if(act==="toggle-ag"){ const x=S.ag.find(y=>y.id===id); if(x){ try{ await save("ag",x.id,{...x,concluido:!x.concluido}); }catch(ex){} } }
  else if(act==="sel-day"){ ui.a.sel=a.dataset.d; if(mkey(ui.a.sel)!==ui.a.mes) ui.a.mes=mkey(ui.a.sel); render(); }
  else if(act==="mes"){ const n=+a.dataset.n; ui.a.mes = n===0?mkey(HOJE):addMonths(ui.a.mes,n); if(n===0) ui.a.sel=HOJE; render(); }
  else if(act==="new-loja"&&isAdm()) lojaForm(null);
  else if(act==="edit-loja"){ const x=lojaBy(id); if(x){ if(isAdm()) lojaForm(x); else { ui.cc=x.id; saveUi(); ui.view="painel"; render(); } } }
  else if(act==="edit-cat"&&isAdm()) catForm(id);
  else if(act==="rel-xlsx") relatorio(a.dataset.k,"xlsx",a);
  else if(act==="rel-pdf") relatorio(a.dataset.k,"pdf",a);
  else if(act==="ag-pdf") relatorio("agenda","pdf",a);
  else if(act==="rec-enc"&&isAdm()){ const rc=S.rec.find(x=>x.id===id); if(rc) confirmBtn(a,"Confirmar",()=>{ const ult=S.lanc.filter(l=>l.recId===rc.id&&l.pago).map(compOf).sort().pop(); encerrarRec(rc, ult&&ult>mkey(HOJE)?ult:mkey(HOJE)); }); }
  else if(act==="cfg-default"&&isAdm()){ a.disabled=true; try{ await saveCfg(JSON.parse(JSON.stringify(DEFAULT_CFG))); toast("Plano de contas criado"); }catch(ex){ a.disabled=false; } }
  else if(act==="rm-ex"&&isAdm()) confirmBtn(a,"Confirmar: remover todos os exemplos",async()=>{
    a.disabled=true; let n=0;
    const jobs=[...S.lanc.filter(x=>x.exemplo).map(x=>["lanc",x.id]),...S.forn.filter(x=>x.exemplo).map(x=>["forn",x.id]),...S.ag.filter(x=>x.exemplo).map(x=>["ag",x.id]),...S.lojas.filter(x=>x.exemplo).map(x=>["lojas",x.id])];
    for(const [k,i] of jobs){ try{ await del(k,i); n++; if(n%10===0) a.textContent=`Removendo… ${n}/${jobs.length}`; }catch(ex){ break; } }
    toast(`${n} registros de exemplo removidos`);
  });
});
let qT;
document.addEventListener("input",e=>{
  const t=e.target; if($("#modalRoot").contains(t)) return;
  if(t.id==="fcQ"){ clearTimeout(qT); qT=setTimeout(()=>{ ui.c.q=t.value; render(); },220); }
  if(t.id==="flQ"){ clearTimeout(qT); qT=setTimeout(()=>{ ui.l.q=t.value; render(); },220); }
  if(t.id==="ffoQ"){ clearTimeout(qT); qT=setTimeout(()=>{ ui.fo.q=t.value; render(); },220); }
  if(t.id==="drQ"){ clearTimeout(qT); qT=setTimeout(()=>{ ui.drq=t.value; render(); },220); }
  if(t.id==="frQ"){ clearTimeout(qT); qT=setTimeout(()=>{ ui.rq=t.value; render(); },220); }
  if(t.id==="dgQ"){ clearTimeout(qT); qT=setTimeout(()=>{ ui.dg=ui.dg||{}; ui.dg.q=t.value; render(); },220); }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="tenSel"){ abrirTenant(t.value); return; }
  if(t.id==="rrSel"){ ui.rreg=t.value; render(); return; }
  if(t.id==="dgCat"){ ui.dg=ui.dg||{}; ui.dg.cat=t.value; render(); return; }
  if(t.dataset&&t.dataset.vlanc){ if(S.role==="ro"){ toast("Somente leitura."); render(); return; } const l=S.lanc.find(x=>x.id===t.dataset.vlanc); const v=parseMoney(t.value); if(!l||!t.value.trim()) return; if(!(v>0)){ toast("Valor inválido — use números, ex.: 1.250,00"); return; } save("lanc",l.id,{...l,valor:v,valorPendente:false,atualizado:new Date().toISOString()}).then(()=>toast(`Valor de ${mlabel(compOf(l))} salvo: ${fmt(v)}`)).catch(()=>{}); return; }
  if($("#modalRoot").contains(t)||t.closest("#fMz")) return;
  if(t.id==="ccSel"){ ui.cc=t.value; saveUi(); render(); return; }
  const map={flMes:["l","mes"],ffIni:["f","ini"],fdIni:["d","ini"],fdFim:["d","fim"]};
  if(map[t.id]){ const [g,k]=map[t.id]; if((k==="ini"||k==="fim")&&!t.value) return; ui[g][k]=t.value; render(); }
});

iniciar();
})();
</script>
</body></html>
